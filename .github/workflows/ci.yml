# Builds and verifies on every push to main and on every pull request.
# This is the gate that catches breakage (e.g. Renovate dependency bumps) before it lands on main:
# the publish workflow only runs on release, so without this a red build stays invisible until
# release time and Renovate PRs carry no status check.
#
# The library targets Java 21 (<release>21</release> in pom.xml) but builds on the current JDK,
# matching druvu-lib-jdbc, druvu-lib-json and druvu-acc-parent. Every dependency resolves from
# Maven Central, so no registry authentication is wired in.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Build and verify
        run: mvn -B verify
