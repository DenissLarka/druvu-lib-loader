# Builds, signs and publishes the artifact to Maven Central when a GitHub release is created.
# Can also be run by hand for an existing tag, after a fix on main.
# Requires the repository secrets OSSRH_USERNAME, OSSRH_TOKEN (the Central portal token), GPG_PRIVATE_KEY, GPG_PASSPHRASE.

name: Publish to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish
        required: true

jobs:
  publish:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'zulu'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD

    - name: Import GPG key
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        gpg --list-secret-keys --keyid-format LONG
        # Configure GPG for non-interactive use
        echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
        echo "use-agent" >> ~/.gnupg/gpg.conf
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
        gpgconf --kill gpg-agent

    - name: Build, sign and publish
      run: mvn -B deploy -Prelease
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
